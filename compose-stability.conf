// These model types live in :launcher-core (a non-Compose module), so the Compose compiler can't infer
// their stability and would treat them as UNSTABLE — forcing connection rows to recompose even when their
// data is unchanged. They are effectively immutable (all-`val` data classes / enums), so mark them stable.
